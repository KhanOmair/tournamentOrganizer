<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tournament Organizer is a web app for managing tournaments, players, and matches.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tourney_app">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Tournament Organizer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#101820">
  <style>
    html, body { margin: 0; background: #101820; color: #F4F7EF; }
    #app-loading { min-height: 100vh; display: grid; place-content: center;
      font: 14px system-ui, sans-serif; text-align: center; gap: 16px; }
    #app-loading .loader { width: 28px; height: 28px; margin: auto;
      border: 3px solid #344453; border-top-color: #D4F45B; border-radius: 50%;
      animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #app-loading .loader { animation: none; } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('app-loading')?.remove();
    });
  </script>
</head>

<body>
  <div id="app-loading" role="status"><div class="loader" aria-hidden="true"></div>Loading Tournament Organizer…</div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
